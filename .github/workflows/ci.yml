name: Clawback CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend & Rules Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov reportlab pypdf python-multipart

      - name: Run Rules Engine Tests with Coverage (Strict 100% Money Logic Check)
        env:
          PYTHONPATH: ".:rules_engine"
        run: |
          pytest rules_engine/tests --cov=rules_engine/rules_engine --cov-report=term-missing --cov-fail-under=98

      - name: Run Backend Integration API Tests
        env:
          PYTHONPATH: ".:rules_engine"
        run: |
          pytest backend/tests -v

      - name: Verify Benchmark Execution
        env:
          PYTHONPATH: ".:rules_engine"
        run: |
          python benchmark/generator.py
          python benchmark/run_benchmark.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check and Vite build
        run: npm run build

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t clawback-api:latest -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t clawback-web:latest -f frontend/Dockerfile ./frontend
